<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گفتار فارسی</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Tahoma,Arial,sans-serif;direction:rtl;background:linear-gradient(135deg,#eef5ff,#fff);min-height:100vh}
.container{max-width:700px;margin:20px auto;background:#fff;padding:25px;border-radius:25px;box-shadow:0 10px 35px rgba(0,0,0,.12);text-align:center}
h1{color:#174ea6;font-size:28px}
.subtitle{color:#666;font-size:17px;margin-bottom:25px}
.mic{width:110px;height:110px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#1769ff,#00a8ff);display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 8px 25px rgba(23,105,255,.3);cursor:pointer;user-select:none}
.mic.rec{background:linear-gradient(135deg,#16a34a,#22c55e);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 25px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.status{padding:12px;border-radius:12px;margin-bottom:20px;font-size:16px;background:#f1f5f9;color:#555}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px 0}
button{border:none;border-radius:14px;padding:13px 22px;font-family:Tahoma;font-size:16px;cursor:pointer;background:#e8eef7;color:#222}
button:disabled{opacity:.5;cursor:not-allowed}
.start{background:#16a34a;color:#fff}
.stop{background:#dc2626;color:#fff}
.save{background:#174ea6;color:#fff}
.box{margin-top:25px;text-align:right;background:#f8fafc;border:1px solid #dbe3ee;border-radius:18px;padding:20px;min-height:180px}
.box h2{margin-top:0;color:#174ea6;font-size:21px}
#text{font-size:19px;line-height:2;color:#222;white-space:pre-wrap;min-height:100px}
.interim{color:#999}
.hist{margin-top:35px;text-align:right}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e2e8f0}
.hist-head h2{margin:0;color:#174ea6;font-size:21px}
.clr-all{background:transparent;color:#dc2626;padding:6px 12px;font-size:14px}
.hist-list{display:flex;flex-direction:column;gap:12px;max-height:500px;overflow-y:auto}
.hist-item{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px}
.hist-meta{margin-bottom:8px;font-size:12px;color:#94a3b8}
.hist-text{font-size:16px;line-height:1.9;color:#222;margin-bottom:10px;word-wrap:break-word}
.hist-actions{display:flex;gap:6px;flex-wrap:wrap}
.hist-actions button{padding:7px 14px;font-size:14px;border-radius:10px}
.b-copy{background:#e0f2fe;color:#0369a1}
.b-read{background:#f3e8ff;color:#7c3aed}
.b-del{background:#fee2e2;color:#b91c1c}
.empty{text-align:center;color:#94a3b8;padding:30px 10px;font-size:15px}
@media(max-width:600px){body{padding:10px}.container{padding:18px}h1{font-size:24px}.mic{width:95px;height:95px;font-size:42px}button{flex:1;min-width:100px;padding:13px 10px}}
</style>
</head>
<body>
<div class="container">
<h1>🎙️ گفتار فارسی</h1>
<p class="subtitle">تبدیل صدای فارسی به متن</p>
<div class="mic" id="mic" onclick="toggleRec()">🎤</div>
<div class="status" id="status">آماده دریافت صدا</div>
<div class="btns">
<button class="start" id="btnStart" onclick="startRec()">🎙️ شروع</button>
<button class="stop" id="btnStop" onclick="stopRec()" disabled>⏹️ توقف</button>
</div>
<div class="box">
<h2>📝 متن فارسی</h2>
<div id="text">متن شما اینجا نمایش داده می‌شود...</div>
</div>
<div class="btns">
<button class="save" onclick="saveText()">💾 ذخیره در تاریخچه</button>
<button onclick="copyText()">📋 کپی متن</button>
<button onclick="readText()">🔊 خواندن</button>
<button onclick="clearText()">🗑️ پاک کردن</button>
</div>
<div class="hist">
<div class="hist-head">
<h2>📚 تاریخچه</h2>
<button class="clr-all" onclick="clearAll()">🗑️ حذف همه</button>
</div>
<div class="hist-list" id="histList"></div>
</div>
</div>

<script>
var rec = null;
var listening = false;
var speechText = "";
var historyItems = [];
var STORAGE_KEY = "persianSpeechHistory";

function setStatus(msg, type) {
    var el = document.getElementById("status");
    el.innerText = msg;
    if (type === "rec") {
        el.style.background = "#dcfce7";
        el.style.color = "#16a34a";
    } else if (type === "err") {
        el.style.background = "#fef2f2";
        el.style.color = "#dc2626";
    } else if (type === "ok") {
        el.style.background = "#dbeafe";
        el.style.color = "#1d4ed8";
    } else {
        el.style.background = "#f1f5f9";
        el.style.color = "#555";
    }
}

function updateBtns(recording) {
    document.getElementById("btnStart").disabled = recording;
    document.getElementById("btnStop").disabled = !recording;
}

function toggleRec() {
    if (listening) {
        stopRec();
    } else {
        startRec();
    }
}

function startRec() {
    if (listening) return;

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        setStatus("❌ این مرورگر پشتیبانی نمی‌کند", "err");
        return;
    }

    rec = new SR();
    rec.lang = "fa-IR";
    rec.continuous = true;
    rec.interimResults = true;

    rec.onstart = function () {
        listening = true;
        setStatus("🎙️ در حال گوش دادن... صحبت کنید", "rec");
        document.getElementById("mic").classList.add("rec");
        updateBtns(true);
    };

    rec.onresult = function (event) {
        var finalText = "";
        var interimText = "";
        for (var i = 0; i < event.results.length; i++) {
            var t = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalText = finalText + t + " ";
            } else {
                interimText = interimText + t;
            }
        }
        speechText = finalText;
        var el = document.getElementById("text");
        if (interimText) {
            el.innerHTML = speechText + '<span class="interim">' + interimText + '</span>';
        } else {
            el.innerText = speechText;
        }
    };

    rec.onerror = function (event) {
        var msg = "";
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            msg = "❌ دسترسی به میکروفون رد شد";
        } else if (event.error === "no-speech") {
            msg = "🔇 صدایی شنیده نشد";
        } else if (event.error === "network") {
            msg = "🌐 خطای شبکه";
        } else if (event.error === "aborted") {
            msg = "⏹️ ضبط لغو شد";
        } else {
            msg = "⚠️ خطا: " + event.error;
        }
        setStatus(msg, "err");
        listening = false;
        document.getElementById("mic").classList.remove("rec");
        updateBtns(false);
    };

    rec.onend = function () {
        listening = false;
        setStatus("⏹️ تشخیص صدا متوقف شد");
        document.getElementById("mic").classList.remove("rec");
        updateBtns(false);
    };

    try {
        rec.start();
    } catch (e) {
        console.log(e);
    }
}

function stopRec() {
    if (rec && listening) {
        rec.stop();
        listening = false;
        setStatus("⏹️ متوقف شد");
        document.getElementById("mic").classList.remove("rec");
        updateBtns(false);
    }
}

function copyText() {
    var text = document.getElementById("text").innerText;
    if (!text || text === "متن شما اینجا نمایش داده می‌شود...") return;
    doCopy(text);
    setStatus("✅ متن کپی شد", "ok");
}

function readText() {
    var text = document.getElementById("text").innerText;
    if (!text || text === "متن شما اینجا نمایش داده می‌شود...") return;
    speak(text);
    setStatus("🔊 در حال خواندن...", "ok");
}

function speak(text) {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "fa-IR";
    u.rate = 1.0;
    var voices = window.speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang === "fa-IR" || voices[i].lang.indexOf("fa") === 0) {
            u.voice = voices[i];
            break;
        }
    }
    window.speechSynthesis.speak(u);
}

function clearText() {
    speechText = "";
    document.getElementById("text").innerText = "متن شما اینجا نمایش داده می‌شود...";
    setStatus("آماده دریافت صدا");
}

function doCopy(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
    } else {
        var ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
    }
}

function saveText() {
    var text = speechText.trim();
    if (!text) {
        setStatus("⚠️ متنی برای ذخیره وجود ندارد", "err");
        return;
    }
    var item = {
        id: Date.now(),
        text: text,
        date: new Date().toLocaleString("fa-IR")
    };
    historyItems.unshift(item);
    saveHist();
    renderHist();
    setStatus("💾 در تاریخچه ذخیره شد", "ok");
}

function saveHist() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(historyItems));
    } catch (e) {
        console.log(e);
    }
}

function loadHist() {
    try {
        var s = localStorage.getItem(STORAGE_KEY);
        if (s) historyItems = JSON.parse(s);
    } catch (e) {
        historyItems = [];
    }
}

function renderHist() {
    var list = document.getElementById("histList");
    
    if (historyItems.length === 0) {
        list.innerHTML = '<div class="empty">هنوز چیزی ذخیره نشده 📭</div>';
        return;
    }
    
    var html = "";
    for (var i = 0; i < historyItems.length; i++) {
        var item = historyItems[i];
        html += '<div class="hist-item">';
        html += '<div class="hist-meta">🕐 ' + item.date + '</div>';
        html += '<div class="hist-text">' + escapeHtml(item.text) + '</div>';
        html += '<div class="hist-actions">';
        html += '<button class="b-copy" onclick="copyItem(' + item.id + ')">📋 کپی</button>';
        html += '<button class="b-read" onclick="readItem(' + item.id + ')">🔊 خواندن</button>';
        html += '<button class="b-del" onclick="delItem(' + item.id + ')">🗑️ حذف</button>';
        html += '</div></div>';
    }
    list.innerHTML = html;
}

function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function findItem(id) {
    for (var i = 0; i < historyItems.length; i++) {
        if (historyItems[i].id === id) return historyItems[i];
    }
    return null;
}

function copyItem(id) {
    var item = findItem(id);
    if (!item) return;
    doCopy(item.text);
    setStatus("✅ متن کپی شد", "ok");
}

function readItem(id) {
    var item = findItem(id);
    if (!item) return;
    speak(item.text);
    setStatus("🔊 در حال خواندن...", "ok");
}

function delItem(id) {
    var newArr = [];
    for (var i = 0; i < historyItems.length; i++) {
        if (historyItems[i].id !== id) {
            newArr.push(historyItems[i]);
        }
    }
    historyItems = newArr;
    saveHist();
    renderHist();
    setStatus("🗑️ آیتم حذف شد");
}

function clearAll() {
    if (historyItems.length === 0) return;
    if (!confirm("همه‌ی تاریخچه حذف شود؟")) return;
    historyItems = [];
    saveHist();
    renderHist();
    setStatus("🗑️ تاریخچه پاک شد");
}

window.addEventListener("DOMContentLoaded", function () {
    loadHist();
    renderHist();
});
</script>
</body>
</html>
